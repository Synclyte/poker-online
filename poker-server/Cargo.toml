[package]
name = "poker-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Server-side poker logic"

[dependencies]
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.126"
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[lib]
crate-type = ["cdylib", "rlib"]