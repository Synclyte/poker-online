name: Deploy Poker Server

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain and Wasm Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: poker-server/package-lock.json

      - name: Build Project
        run: |
          wasm-pack build poker-engine --target nodejs --out-dir ../poker-server/pkg
          cd poker-client
          npm install
          npm run build
          mkdir -p ../poker-server/public
          cp -r dist/* ../poker-server/public
          cd ../poker-server
          npm install
          npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "poker-server/dist/,poker-server/pkg/,poker-server/public/,poker-server/package.json,poker-server/package-lock.json"
          target: "/var/www/poker.synclyte.online"
          strip_components: 1

      - name: Restart PM2 Process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/poker.synclyte.online
            npm install --omit=dev
            pm2 restart poker-server || pm2 start dist/server.js --name poker-server
            pm2 save
